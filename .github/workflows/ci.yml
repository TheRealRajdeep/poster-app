name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Get dependencies (whole workspace)
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test app
        run: flutter test

      - name: Spec schema matches fixtures (Python)
        run: |
          pip install jsonschema
          python packages/poster_spec/tool/check_schema.py packages/poster_spec

      - name: Test poster_spec (pure Dart)
        working-directory: packages/poster_spec
        run: dart test

      - name: Test poster_renderer
        working-directory: packages/poster_renderer
        run: flutter test

      - name: Test wa_share
        working-directory: packages/wa_share
        run: flutter test

  android-build:
    # flutter test never compiles Kotlin; this catches plugin/manifest breakage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Build debug APK (app + wa_share plugin)
        run: flutter build apk --debug
